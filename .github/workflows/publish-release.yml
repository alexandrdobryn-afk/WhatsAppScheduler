name: Publish APK Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="$(git describe --tags --abbrev=0)"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Verify APK asset
        shell: bash
        run: |
          test -f download/app-release.apk
          sha256sum download/app-release.apk

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" download/app-release.apk --clobber
          else
            gh release create "${RELEASE_TAG}" download/app-release.apk \
              --title "${RELEASE_TAG}" \
              --notes "Signed APK release for WA Schedule ${RELEASE_TAG}."
          fi
